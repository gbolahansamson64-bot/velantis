<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Orders | Velantis</title>
<meta name="description" content="Track and review your Velantis orders.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/images/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/cormorant-garamond-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/jost-latin.woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/header.css">
<link rel="stylesheet" href="/assets/css/footer.css">
<link rel="stylesheet" href="/assets/css/orders.css">
</head>
<body data-page="orders">

<!-- HEADER: built by /assets/js/header.js (same as every page) -->
<script src="/assets/js/header.js"></script>

<main class="or" id="top">
 <div class="or-grid">

  <!-- DESKTOP / TABLET SIDEBAR (hidden on phones: the phone's account page + bottom nav do this job) -->
  <aside class="or-side" aria-label="Account menu">
   <section class="or-prof">
    <div class="or-av" id="orAv" aria-hidden="true"></div>
    <h2 id="orHi">Hi, there</h2>
    <p id="orMail"></p>
   </section>
   <nav class="or-nav">
    <a href="login.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
    <a href="orders.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>My Orders</a>
    <a href="wishlist.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/></svg>Wishlist</a>
    <button type="button" id="orOut"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5a1 1 0 00-1 1v14a1 1 0 001 1h5M15 8l4 4-4 4M19 12H9"/></svg>Logout</button>
   </nav>
   <a class="or-promo" href="shop.html">
    <img src="/assets/images/luxury-gold-watch-800.webp" alt="" width="400" height="400" loading="lazy" decoding="async">
    <span><b>Elevate Your Style</b><small>With VELANTIS</small></span>
   </a>
  </aside>

  <!-- ORDERS -->
  <section class="or-main" aria-labelledby="orTitle">
   <header class="or-head">
    <a class="or-back" href="login.html" aria-label="Back to your account"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></a>
    <h1 id="orTitle">Your Orders</h1>
    <label class="or-sel"><span class="or-sr">Filter orders</span>
     <select id="orFilter">
      <option value="all">All Orders</option>
      <option value="processing">Processing</option>
      <option value="shipped">Shipped</option>
      <option value="delivered">Delivered</option>
      <option value="cancelled">Cancelled</option>
     </select>
    </label>
   </header>

   <!-- phone filter: swipeable pills (same state as the dropdown) -->
   <div class="or-chips" id="orChips" role="group" aria-label="Filter orders">
    <button type="button" data-f="all" aria-pressed="true">All</button>
    <button type="button" data-f="processing" aria-pressed="false">Processing</button>
    <button type="button" data-f="shipped" aria-pressed="false">Shipped</button>
    <button type="button" data-f="delivered" aria-pressed="false">Delivered</button>
    <button type="button" data-f="cancelled" aria-pressed="false">Cancelled</button>
   </div>

   <p class="or-demo" id="orDemo" hidden>Preview mode: these are sample orders, not saved.</p>
   <ol class="or-list" id="orList" aria-live="polite"></ol>

   <!-- shown when there are no orders at all, or none in the chosen filter -->
   <section class="or-empty" id="orEmpty" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>
    <h2 id="orEmptyT">No orders yet</h2>
    <p id="orEmptyP">When you place an order, it will show up here so you can follow it.</p>
    <a class="or-btn or-solid" id="orEmptyA" href="shop.html">Browse the collection</a>
   </section>
  </section>
 </div>
</main>

<!-- FOOTER: built by /assets/js/footer.js -->
<script src="/assets/js/footer.js"></script>

<!-- APP-STYLE BOTTOM NAV (phone + tablet only), Account marked as the current page -->
<nav class="mnav" id="mnav" aria-label="App navigation">
 <a href="index.html" data-k="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 11.5L12 3l9 8.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg><span>Home</span></a>
 <a href="index.html#legacy" data-k="about"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.01"/></svg><span>About</span></a>
 <a href="shop.html" data-k="shop"><svg class="i" viewBox="0 0 24 24"><path d="M9 8.6V7.2a3 3 0 016 0v1.4" fill="none" stroke-width="1.8"/><path fill="currentColor" fill-rule="evenodd" d="M5.4 8.6h13.2l1.1 10.9a1.4 1.4 0 01-1.4 1.5H5.7a1.4 1.4 0 01-1.4-1.5zM12 10.2a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2z"/></svg><span>Shop</span></a>
 <a href="#footer" data-k="contact"><svg class="i" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 011.7 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg><span>Contact</span></a>
 <a href="login.html" data-k="account" aria-current="page"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Account</span></a>
</nav>

<script src="/assets/js/orders.js"></script>
<script src="/assets/js/live-chat.js" data-logo="/assets/images/velantis-chat-profile.webp"></script>
</body>
</html>
